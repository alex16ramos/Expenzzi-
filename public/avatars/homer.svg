<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="homerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#homerBg)"/>
  
  <g transform="translate(100, 112) scale(1.35) translate(-100, -100)">
    <!-- Neck & Collar -->
    <path d="M 72 135 L 72 175 L 128 175 L 128 135 Z" fill="#FED434" />
    <path d="M 55 170 L 145 170 L 160 200 L 40 200 Z" fill="#FFFFFF" />
    
    <!-- Head Base -->
    <ellipse cx="100" cy="80" rx="42" ry="48" fill="#FED434" />
    
    <!-- Beard Stubble Area -->
    <ellipse cx="100" cy="115" rx="36" ry="24" fill="#D1B271" stroke="#000000" stroke-width="2" />
    
    <!-- Eyes -->
    <circle cx="82" cy="76" r="17" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    <circle cx="118" cy="76" r="17" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    <circle cx="86" cy="76" r="3.5" fill="#000000" />
    <circle cx="114" cy="76" r="3.5" fill="#000000" />
    
    <!-- Nose -->
    <path d="M 94 78 Q 80 94 102 92 C 104 86, 98 80, 94 78 Z" fill="#FED434" stroke="#000000" stroke-width="2.5" />
    
    <!-- Mouth -->
    <path d="M 74 116 Q 100 132 126 116" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Top Hair Strands -->
    <path d="M 86 32 Q 93 18 100 32" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 96 32 Q 103 18 110 32" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Side Hair 'M' -->
    <path d="M 58 84 Q 48 80 54 72 Q 46 70 54 62" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" />
    
    <!-- Ears -->
    <circle cx="58" cy="88" r="7" fill="#FED434" stroke="#000000" stroke-width="2" />
  </g>
</svg>
