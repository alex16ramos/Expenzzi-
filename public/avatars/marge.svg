    <circle cx="116" cy="115" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.2" />
    <circle cx="87" cy="115" r="3" fill="#000000" />
    <circle cx="113" cy="115" r="3" fill="#000000" />
    <!-- Eyelashes -->
    <path d="M 72 106 L 66 102 M 76 103 L 73 96 M 84 102 L 84 95" stroke="#000000" stroke-width="2" stroke-linecap="round" />
    <path d="M 128 106 L 134 102 M 124 103 L 127 96 M 116 102 L 116 95" stroke="#000000" stroke-width="2" stroke-linecap="round" />
    
    <!-- Nose -->
    <path d="M 96 118 Q 86 128 102 127" fill="none" stroke="#000000" stroke-width="2.2" />
    <!-- Smile -->
    <path d="M 82 140 Q 100 152 118 140" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" />
