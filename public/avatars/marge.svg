<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="margeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#margeBg)"/>
  
  <g transform="translate(100, 115) scale(1.2) translate(-100, -100)">
