    <path d="M 68 120 C 50 100 45 40 60 10 C 70 0 130 0 140 10 C 155 40 150 100 132 120 Z" fill="#2563EB" stroke="#000000" stroke-width="2.5" />
    <circle cx="70" cy="30" r="18" fill="#2563EB" />
    <circle cx="130" cy="30" r="18" fill="#2563EB" />
    <circle cx="70" cy="60" r="18" fill="#2563EB" />
    <circle cx="130" cy="60" r="18" fill="#2563EB" />
    <circle cx="100" cy="20" r="22" fill="#2563EB" />
    
    <!-- Red Pearl Necklace -->
    <circle cx="76" cy="168" r="8" fill="#EF4444" stroke="#000000" stroke-width="1.5" />
    <circle cx="92" cy="173" r="9" fill="#EF4444" stroke="#000000" stroke-width="1.5" />
    <circle cx="108" cy="173" r="9" fill="#EF4444" stroke="#000000" stroke-width="1.5" />
    <circle cx="124" cy="168" r="8" fill="#EF4444" stroke="#000000" stroke-width="1.5" />

    <!-- Face & Neck -->
    <path d="M 78 130 L 78 165 L 122 165 L 122 130 Z" fill="#FED434" />
